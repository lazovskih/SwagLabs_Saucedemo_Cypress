name: Cypress Tests
on:
  push:
  pull_request:
    branches: [main, master]
jobs:
  cypress-run:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: TEST
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        # Uses official Cypress GitHub Action to install, cache, verify, and run tests
        uses: cypress-io/github-action@v7
        with:
          # Records to Cypress Cloud and runs in parallel across containers
          record: true
          parallel: true
        env:
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          URL: ${{ vars.URL }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload Cypress artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ matrix.containers }}
          path: |
            cypress/screenshots
            cypress/videos
            cypress/reports
          if-no-files-found: ignore
          retention-days: 10

